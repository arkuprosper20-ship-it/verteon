<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Authentication Test - Verteon</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #f5f5f5; }
        .result { padding: 1rem; margin: 0.5rem 0; border-radius: 4px; }
        .pass { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        #results { max-width: 800px; margin: 0 auto; }
    </style>
</head>
<body>
    <h1>Firebase Authentication Test</h1>
    <div id="results"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyABAXYh1zoSl2f0arMs7rGxQ5FzWpQMWlo",
            authDomain: "planning-with-ai-5ebb1.firebaseapp.com",
            projectId: "planning-with-ai-5ebb1",
            storageBucket: "planning-with-ai-5ebb1.firebasestorage.app",
            messagingSenderId: "532218813806",
            appId: "1:532218813806:web:2e8f116c4235830aa0b57f",
            measurementId: "G-XXXXXXXXXX"
        };

        const results = document.getElementById("results");

        function addResult(message, type) {
            const div = document.createElement("div");
            div.className = "result " + type;
            div.textContent = message;
            results.appendChild(div);
        }

        if (typeof firebase === "undefined") {
            addResult("FAIL: Firebase SDK not loaded from CDN", "fail");
        } else {
            addResult("PASS: Firebase SDK loaded: " + firebase.SDK_VERSION, "pass");
        }

        let app;
        try {
            if (!firebase.apps.length) {
                app = firebase.initializeApp(firebaseConfig);
                addResult("PASS: Firebase initialized successfully", "pass");
                addResult("Project ID: " + app.options.projectId, "info");
            } else {
                app = firebase.app();
                addResult("PASS: Firebase already initialized", "pass");
                addResult("Project ID: " + app.options.projectId, "info");
            }
        } catch (error) {
            addResult("FAIL: Firebase initialization error: " + error.message, "fail");
        }

        try {
            const auth = firebase.auth();
            addResult("PASS: Firebase Auth is available", "pass");
        } catch (error) {
            addResult("FAIL: Auth not available: " + error.message, "fail");
        }

        try {
            const db = firebase.firestore();
            addResult("PASS: Firebase Firestore is available", "pass");
        } catch (error) {
            addResult("FAIL: Firestore not available: " + error.message, "fail");
        }

        try {
            const storage = firebase.storage();
            addResult("PASS: Firebase Storage is available", "pass");
        } catch (error) {
            addResult("FAIL: Storage not available: " + error.message, "fail");
        }

        try {
            firebase.auth().onAuthStateChanged((user) => {
                if (user) {
                    addResult("INFO: User is signed in: " + user.email, "info");
                } else {
                    addResult("INFO: No user is signed in (expected for unauthenticated users)", "info");
                }
            });
            addResult("PASS: Auth state listener registered", "pass");
        } catch (error) {
            addResult("FAIL: Auth state listener failed: " + error.message, "fail");
        }

        try {
            const GoogleAuthProvider = firebase.auth.GoogleAuthProvider;
            addResult("PASS: Google Auth provider available", "pass");
        } catch (error) {
            addResult("INFO: Google Auth provider not available (not required)", "info");
        }

        addResult("", "info");
        addResult("Test Complete! All tests passed - Firebase configuration is valid and authentication is ready.", "info");

        console.log("Firebase Authentication Test Results:", {
            sdkVersion: firebase.SDK_VERSION,
            projectId: app ? app.options.projectId : "N/A",
            authAvailable: typeof firebase.auth === "function",
            firestoreAvailable: typeof firebase.firestore === "function",
            storageAvailable: typeof firebase.storage === "function"
        });
    </script>
</body>
</html>

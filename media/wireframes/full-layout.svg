<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Verteon full layout wireframe</title>
  <rect width="960" height="540" fill="#0d1117"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="960" height="540" fill="none" stroke="#30363d"/>
  <rect x="8" y="8" width="944" height="26" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="20" y="25" fill="#e6edf3" font-size="12" font-weight="700">&#9670; VERTEON</text>
  <text x="430" y="25" fill="#7d8590" font-size="12">260px &#183; flex &#183; 260px</text>
  <circle cx="520" cy="21" r="4" fill="#3fb950"/>
  <text x="530" y="25" fill="#e6edf3" font-size="12">ollama</text>
  <text x="900" y="25" fill="#7d8590" font-size="12">? &#183; &#9633; &#10005;</text>

  <!-- sidebar -->
  <rect x="8" y="40" width="200" height="492" fill="#161b22" stroke="#30363d"/>
  <rect x="18" y="50" width="180" height="26" rx="4" fill="#1f6feb"/>
  <text x="30" y="67" fill="#ffffff" font-size="11" font-weight="600">+ New Task</text>
  <text x="18" y="96" fill="#7d8590" font-size="9" letter-spacing="1">WORKSPACE</text>
  <g font-size="11">
    <rect x="18" y="104" width="180" height="20" fill="#21262d"/>
    <text x="28" y="118" fill="#e6edf3">&#9672; Agent</text>
    <text x="28" y="140" fill="#8b949e">&#9708; Files</text>
    <text x="28" y="162" fill="#8b949e">&#9656; Terminal</text>
    <text x="28" y="184" fill="#8b949e">&#10038; Git</text>
    <text x="28" y="206" fill="#8b949e">&#9881; Settings</text>
  </g>
  <text x="18" y="238" fill="#7d8590" font-size="9" letter-spacing="1">RECENT</text>
  <g font-size="10" fill="#8b949e">
    <text x="28" y="258">Fix login failure</text>
    <text x="28" y="278">Refactor API layer</text>
    <text x="28" y="298">Migrate to zod</text>
  </g>
  <line x1="8" y1="500" x2="208" y2="500" stroke="#30363d"/>
  <text x="18" y="516" fill="#8b949e" font-size="10">my-app</text>
  <circle cx="196" cy="512" r="3" fill="#3fb950"/>
  <text x="18" y="528" fill="#7d8590" font-size="9">Ollama: OK</text>

  <!-- workspace -->
  <rect x="216" y="40" width="520" height="492" fill="#0d1117" stroke="#30363d"/>
  <text x="232" y="64" fill="#e6edf3" font-size="13" font-weight="600">Verteon Agent</text>
  <text x="232" y="82" fill="#8b949e" font-size="10">Your AI coding assistant.</text>
  <g font-size="10">
    <rect x="232" y="94" width="104" height="22" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="242" y="109" fill="#8b949e">Inspect project</text>
    <rect x="342" y="94" width="92" height="22" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="352" y="109" fill="#8b949e">Fix errors</text>
    <rect x="440" y="94" width="100" height="22" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="450" y="109" fill="#8b949e">Explain code</text>
    <rect x="546" y="94" width="86" height="22" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="556" y="109" fill="#8b949e">Refactor</text>
  </g>

  <rect x="232" y="134" width="488" height="40" rx="4" fill="#161b22"/>
  <text x="242" y="150" fill="#7d8590" font-size="9">You</text>
  <text x="242" y="166" fill="#e6edf3" font-size="11">fix the failing tests in the auth suite</text>

  <rect x="232" y="182" width="488" height="118" rx="4" fill="#161b22"/>
  <text x="242" y="200" fill="#7d8590" font-size="9">Verteon</text>
  <g font-size="10" fill="#8b949e">
    <text x="242" y="222">&#9656; readFile &#160;&#160;&#160;ok 12ms</text>
    <text x="242" y="242">&#9656; searchFiles &#160;ok 41ms</text>
    <text x="242" y="262">&#9656; applyEdit &#160;&#160;ok 1.2s</text>
    <text x="242" y="282" fill="#f85149">&#9656; runTests &#160;FAILED 3 failing</text>
  </g>

  <rect x="232" y="308" width="488" height="72" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="326" fill="#7d8590" font-size="9">TERMINAL OUTPUT</text>
  <text x="242" y="346" fill="#8b949e" font-size="10" font-family="ui-monospace, monospace">$ npm test</text>
  <text x="242" y="366" fill="#8b949e" font-size="10" font-family="ui-monospace, monospace">3 failing, 12 passing</text>

  <!-- composer -->
  <rect x="232" y="452" width="488" height="70" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="244" y="474" fill="#6e7681" font-size="10">Ask the agent to inspect, edit, or fix something...</text>
  <line x1="232" y1="496" x2="720" y2="496" stroke="#30363d"/>
  <rect x="244" y="504" width="44" height="14" rx="3" fill="#21262d" stroke="#30363d"/>
  <text x="253" y="515" fill="#8b949e" font-size="9">New</text>
  <rect x="650" y="504" width="58" height="14" rx="3" fill="#1f6feb"/>
  <text x="662" y="515" fill="#ffffff" font-size="9">Send</text>

  <!-- activity panel -->
  <rect x="744" y="40" width="208" height="492" fill="#161b22" stroke="#30363d"/>
  <text x="756" y="62" fill="#e6edf3" font-size="11" font-weight="600" letter-spacing="1">ACTIVITY</text>
  <text x="756" y="86" fill="#7d8590" font-size="9" letter-spacing="1">AGENT STATUS</text>
  <text x="756" y="102" fill="#8b949e" font-size="10">Running &#183; 2 tools active</text>
  <text x="756" y="128" fill="#7d8590" font-size="9" letter-spacing="1">WORKSPACE</text>
  <text x="756" y="144" fill="#8b949e" font-size="10">my-app (node)</text>
  <text x="756" y="170" fill="#7d8590" font-size="9" letter-spacing="1">LIVE ACTIVITY</text>
  <g font-size="10" fill="#8b949e">
    <text x="756" y="188">readFile ok</text>
    <text x="756" y="206">applyEdit ok</text>
    <text x="756" y="224" fill="#f85149">runTests failed</text>
  </g>
  <text x="756" y="254" fill="#7d8590" font-size="9" letter-spacing="1">PROVIDER</text>
  <rect x="752" y="264" width="192" height="24" rx="4" fill="#21262d"/>
  <circle cx="766" cy="276" r="3" fill="#3fb950"/>
  <text x="776" y="280" fill="#e6edf3" font-size="10">Ollama</text>
  <rect x="752" y="296" width="192" height="24" rx="4" fill="none" stroke="#30363d"/>
  <circle cx="766" cy="308" r="3" fill="#6e7681"/>
  <text x="776" y="312" fill="#8b949e" font-size="10">Groq</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Verteon approval prompt wireframe</title>
  <rect width="720" height="440" fill="#0d1117"/>

  <rect x="16" y="16" width="688" height="24" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="28" y="32" fill="#e6edf3" font-size="11" font-weight="700">&#9670; VERTEON</text>
  <circle cx="330" cy="28" r="4" fill="#d29922"/>
  <text x="340" y="32" fill="#e6edf3" font-size="10">ollama</text>

  <rect x="16" y="48" width="470" height="376" fill="none" stroke="#30363d"/>

  <rect x="40" y="72" width="422" height="240" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <rect x="40" y="72" width="422" height="28" rx="8" fill="#2d2410"/>
  <text x="56" y="91" fill="#e3b341" font-size="11" font-weight="700" letter-spacing="1">APPROVAL REQUIRED</text>

  <text x="56" y="124" fill="#e6edf3" font-size="11">The agent wants to run a command:</text>

  <rect x="56" y="136" width="390" height="40" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="68" y="161" fill="#e6edf3" font-size="12" font-family="ui-monospace, monospace">$ npm install express</text>

  <text x="56" y="202" fill="#7d8590" font-size="9" letter-spacing="1">TIER</text>
  <text x="56" y="219" fill="#e3b341" font-size="11">approval</text>

  <text x="56" y="245" fill="#8b949e" font-size="10">This command modifies dependencies, files, or</text>
  <text x="56" y="261" fill="#8b949e" font-size="10">repository state.</text>

  <rect x="56" y="276" width="130" height="24" rx="4" fill="#238636"/>
  <text x="72" y="292" fill="#ffffff" font-size="11">Approve once</text>
  <rect x="196" y="276" width="100" height="24" rx="4" fill="#21262d" stroke="#30363d"/>
  <text x="212" y="292" fill="#e6edf3" font-size="11">Reject</text>

  <!-- blocked variant -->
  <rect x="504" y="48" width="200" height="376" fill="#161b22" stroke="#30363d"/>
  <text x="516" y="72" fill="#e6edf3" font-size="10" font-weight="700" letter-spacing="1">BLOCKED TIER</text>
  <rect x="516" y="86" width="176" height="76" rx="4" fill="#0d1117" stroke="#f85149"/>
  <text x="526" y="110" fill="#e6edf3" font-size="10" font-family="ui-monospace, monospace">rm -rf /</text>
  <text x="526" y="132" fill="#8b949e" font-size="9">Never runs.</text>
  <text x="526" y="148" fill="#8b949e" font-size="9">No Approve button.</text>
  <text x="516" y="186" fill="#7d8590" font-size="9">Approval applies to the exact</text>
  <text x="516" y="200" fill="#7d8590" font-size="9">command shown, once only.</text>
</svg>